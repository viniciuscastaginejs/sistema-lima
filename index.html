:28px}.login-card{width:min(410px,100%)}.login-card h2{font-size:30px;margin:0 0 8px}.login-card>p{color:var(--muted);margin:0 0 28px}.login-card .field{margin:13px 0}.login-card .btn{width:100%;padding:13px;margin-top:10px}.link{border:0;background:none;color:var(--red);font-weight:700;padding:8px 0}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--dark);color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;width:250px;display:flex;flex-direction:column;z-index:20}.side .brand{padding:2px 7px 23px;border-bottom:1px solid #ffffff16}.side .brand img{width:42px;height:42px}.nav{display:flex;flex-direction:column;gap:4px;margin-top:18px}.nav button{border:0;background:transparent;color:#bfc2ca;text-align:left;border-radius:9px;padding:11px 12px;font-weight:650}.nav button:hover,.nav button.active{background:#e306131b;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--red)}.side-bottom{margin-top:auto;border-top:1px solid #ffffff16;padding-top:14px}.user-chip{padding:9px 8px}.user-chip small{color:#9da2ac;display:block}.main{grid-column:2;padding:0 28px 40px}.top{height:76px;display:flex;align-items:center;gap:14px;position:sticky;top:0;background:#f4f5f7eF;backdrop-filter:blur(12px);z-index:10}.top h1{font-size:23px;margin:0}.top .grow{flex:1}.search{position:relative;width:min(370px,45vw)}.search input{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px}.mobile-menu{display:none}.page-head{display:flex;align-items:center;margin:9px 0 20px;gap:12px}.page-head div:first-child{flex:1}.page-head h2{margin:0;font-size:22px}.page-head p{margin:4px 0 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #eaebef;border-radius:14px;box-shadow:var(--shadow);padding:18px}.stat{position:relative;overflow:hidden}.stat:before{content:"";position:absolute;width:5px;inset:0 auto 0 0;background:var(--red)}.stat small{font-weight:750;color:var(--muted)}.stat b{display:block;font-size:29px;margin-top:7px}.stat em{font-style:normal;font-size:12px;color:var(--muted)}.dashboard-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:14px}.card h3{margin:0 0 14px;font-size:16px}.status-bars{display:flex;align-items:flex-end;gap:25px;height:175px;padding:18px}.bar{flex:1;border-radius:8px 8px 3px 3px;min-height:8px;position:relative}.bar span{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}.bar b{position:absolute;top:-23px;width:100%;text-align:center}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}table{border-collapse:collapse;width:100%;min-width:780px}th,td{padding:12px 14px;border-bottom:1px solid #eff0f2;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#737985;background:#fafafb}td.actions{white-space:nowrap}.badge{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800}.badge.valid,.badge.completed,.badge.approved,.badge.active{background:#e4f5eb;color:var(--green)}.badge.expiring,.badge.in_progress,.badge.sent{background:#fff2d4;color:var(--yellow)}.badge.expired,.badge.cancelled,.badge.rejected,.badge.inactive{background:#fde7e7;color:#bb1d2c}.badge.draft,.badge.planned{background:#eaedf2;color:#596170}.empty{text-align:center;color:var(--muted);padding:40px}.modal-back{position:fixed;inset:0;background:#11151bb0;display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.modal{background:#fff;border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 90px #0005}.modal.wide{width:min(1000px,100%)}.modal-head{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;flex:1}.close{border:0;background:#f0f1f3;border-radius:50%;width:32px;height:32px;font-size:18px}.modal-body{padding:20px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.toast{position:fixed;right:22px;bottom:22px;background:#202328;color:#fff;border-radius:10px;padding:13px 17px;z-index:300;box-shadow:var(--shadow);max-width:360px}.toast.error{background:#aa1724}.timeline{display:flex;flex-direction:column;gap:13px}.timeline-item{border-left:3px solid var(--red);padding-left:12px}.timeline-item small{color:var(--muted)}.quote-items{display:flex;flex-direction:column;gap:9px}.quote-row{display:grid;grid-template-columns:70px 1fr 90px 110px 38px;gap:8px;align-items:end}.quote-row .remove{height:39px;border:0;border-radius:8px;color:var(--red)}.money{font-variant-numeric:tabular-nums}.quote-total{text-align:right;font-size:20px;font-weight:900;margin-top:15px;color:var(--red)}.tutorial-step{display:grid;grid-template-columns:48px 1fr;gap:14px;margin:15px 0}.tutorial-step b{width:38px;height:38px;background:var(--red);color:#fff;display:grid;place-items:center;border-radius:50%}.tutorial-step h4{margin:2px 0 4px}.tutorial-step p{margin:0;color:var(--muted)}.quote-paper{background:#fff;color:#111;width:794px;min-height:1123px;margin:auto;padding:30px;font:12px Arial}.qp-head{display:flex;align-items:center;border-bottom:2px solid #e30613;padding-bottom:15px}.qp-head img{width:170px;height:90px;object-fit:contain}.qp-company{margin-left:auto;line-height:1.6}.qp-red{color:#e30613}.qp-client{display:grid;grid-template-columns:1fr 230px;gap:20px;margin:24px 0}.qp-table{width:100%;min-width:0}.qp-table th{background:#e30613;color:#fff;font-size:11px}.qp-table td,.qp-table th{border:1px solid #ddd;padding:9px}.qp-total-box{display:grid;grid-template-columns:1fr 1fr;margin:14px 0;border:1px solid #ddd;border-radius:8px}.qp-total-box>div{padding:16px}.qp-total-box>div+div{border-left:1px solid #ddd}.qp-section{border:1px solid #ddd;border-radius:8px;padding:14px;margin:13px 0}.qp-section h3{display:inline-block;margin:-14px 0 10px -14px;background:#e30613;color:#fff;padding:7px 14px}.qp-accept{margin-top:18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}.qp-line{border-bottom:1px solid #333;height:28px}.qp-footer{background:#e30613;color:#fff;margin:28px -30px -30px;padding:18px 30px;display:flex;justify-content:space-between;font-weight:bold}.print-only{display:none}
    @media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.quote-row{grid-template-columns:60px 1fr 75px 95px 36px}}
    @media(max-width:760px){.login{grid-template-columns:1fr}.login-art{display:none}.shell{display:block}.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{padding:0 14px 30px}.top{height:64px}.mobile-menu{display:block}.search{display:none}.grid{grid-template-columns:1fr}.grid .span2{grid-column:auto}.cards{grid-template-columns:1fr 1fr}.page-head{align-items:flex-start;flex-wrap:wrap}.quote-row{grid-template-columns:50px 1fr 34px}.quote-row .qty,.quote-row .price{grid-row:2}.quote-row .qty{grid-column:1/2}.quote-row .price{grid-column:2/3}.quote-row .remove{grid-column:3;grid-row:1/3}.modal-back{padding:0}.modal{border-radius:0;max-height:100vh;height:100vh}.modal-foot{position:sticky;bottom:0;background:#fff}}
    @media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}.quote-paper{box-shadow:none;margin:0;width:100%}@page{size:A4;margin:0}}

<body>
<section id="loginView" class="login">
  <div class="login-art"><div class="brand"><img src="logo-lima.png"><div><strong>LIMA</strong><small>Sistemas Contra Incêndio</small></div></div><h1>Controle técnico em um só lugar.</h1><p>Clientes, laudos, documentos, serviços, vencimentos e orçamentos salvos com segurança e disponíveis em qualquer dispositivo.</p></div>
  <div class="login-box"><form id="loginForm" class="login-card"><h2>Bem-vindo</h2><p>Entre para acessar o painel interno.</p><div class="field"><label>E-mail</label><input id="loginEmail" type="email" required autocomplete="username" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input id="loginPassword" type="password" required autocomplete="current-password" placeholder="••••••••"></div><button class="btn red" type="submit">Entrar no sistema</button><button class="link" type="button" id="forgotBtn">Esqueci minha senha</button><p id="loginMessage"></p></form></div>
</section>
<section id="appView" class="shell hidden">
  <aside class="side" id="side"><div class="brand"><img src="logo-lima.png"><div><strong>LIMA</strong><small>Sistema interno</small></div></div><nav class="nav" id="nav"><button data-page="dashboard">▦ &nbsp; Dashboard</button><button data-page="clients">♙ &nbsp; Clientes</button><button data-page="reports">▤ &nbsp; Laudos</button><button data-page="services">⚙ &nbsp; Serviços</button><button data-page="quotes">$ &nbsp; Orçamentos</button><button data-page="documents">▱ &nbsp; Documentos</button><button data-page="reportsArea">◫ &nbsp; Relatórios</button><button data-page="users" data-admin>♚ &nbsp; Usuários</button><button data-page="settings" data-admin>⚙ &nbsp; Configurações</button></nav><div class="side-bottom"><button class="btn small" id="tutorialBtn">? Tutorial</button><div class="user-chip"><strong id="sideName"></strong><small id="sideRole"></small></div><button class="btn small danger" id="logoutBtn">Sair</button></div></aside>
  <main class="main"><header class="top"><button class="btn mobile-menu" id="menuBtn">☰</button><h1 id="pageTitle">Dashboard</h1><div class="grow"></div><div class="search"><input id="globalSearch" placeholder="Pesquisar cliente, laudo, orçamento..."></div><button class="btn small" id="helpBtn">Ajuda</button></header><div id="content"></div></main>
</section>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div><div id="printArea" class="print-only"></div>
<script>
const SUPABASE_URL='https://qlmvrafogyzvcruhvdzt.supabase.co';
const SUPABASE_KEY='sb_publishable_65oXktsruNDH4Wk229Pxjw_Shv5Gg1n';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={user:null,profile:null,page:'dashboard',clients:[],types:[],settings:null};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const iso=()=>new Date().toISOString().slice(0,10);
const statusLabel={valid:'Válido',expiring:'Próximo do vencimento',expired:'Vencido',planned:'Planejado',in_progress:'Em andamento',completed:'Concluído',cancelled:'Cancelado',draft:'Rascunho',sent:'Enviado',approved:'Aprovado',rejected:'Recusado',active:'Ativo',inactive:'Pendente'};
function toast(msg,error=false){const t=$('#toast');t.textContent=msg;t.className='toast'+(error?' error':'');setTimeout(()=>t.classList.add('hidden'),3500)}
function badge(s){return `<span class="badge ${s}">${statusLabel[s]||esc(s)}</span>`}
function modal(title,body,foot='',wide=false){$('#modalRoot').innerHTML=`<div class="modal-back"><div class="modal ${wide?'wide':''}"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`}
function closeModal(){ $('#modalRoot').innerHTML='' }
function err(e){console.error(e);toast(e?.message||'Não foi possível concluir a operação.',true)}
function formObj(form){return Object.fromEntries(new FormData(form).entries())}
function pageHead(title,desc,button=''){return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div>${button}</div>`}
async function init(){const {data:{session}}=await sb.auth.getSession();if(session)await enter(session.user);sb.auth.onAuthStateChange(async(e,s)=>{if(e==='SIGNED_IN'&&s&&!state.user)await enter(s.user);if(e==='SIGNED_OUT')showLogin()})}
async function enter(user){state.user=user;const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error)return err(error);state.profile=p;if(!p.active){await sb.auth.signOut();$('#loginMessage').textContent='Este usuário aguarda aprovação do administrador.';return}await Promise.all([loadClients(),loadTypes(),loadSettings()]);$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#sideName').textContent=p.name||p.email;$('#sideRole').textContent=p.role==='admin'?'Administrador':'Funcionário';$$('[data-admin]').forEach(x=>x.classList.toggle('hidden',p.role!=='admin'));navigate('dashboard')}
function showLogin(){state.user=state.profile=null;$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden')}
async function loadClients(){const {data,error}=await sb.from('clients').select('*').order('name');if(error)throw error;state.clients=data||[]}
async function loadTypes(){const {data,error}=await sb.from('report_types').select('*').eq('active',true).order('name');if(error)throw error;state.types=data||[]}
async function loadSettings(){const {data}=await sb.from('company_settings').select('*').limit(1).maybeSingle();state.settings=data}
async function navigate(page){state.page=page;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#side').classList.remove('open');const titles={dashboard:'Dashboard',clients:'Clientes',reports:'Laudos',services:'Serviços',quotes:'Orçamentos',documents:'Documentos',reportsArea:'Relatórios',users:'Usuários',settings:'Configurações'};$('#pageTitle').textContent=titles[page]||'LIMA';$('#content').innerHTML='<div class="empty">Carregando...</div>';try{await ({dashboard,clients,reports,services,quotes,documents,reportsArea,users,settings}[page]||dashboard)()}catch(e){err(e);$('#content').innerHTML='<div class="empty">Erro ao carregar. Atualize a página.</div>'}}
async function dashboard(){const [{data:r},{count:cc},{count:sc},{data:a}]=await Promise.all([sb.from('reports_with_status').select('id,report_number,expiry_date,calculated_status,clients(name)').order('expiry_date'),sb.from('clients').select('*',{count:'exact',head:true}),sb.from('services').select('*',{count:'exact',head:true}),sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(8)]);const stats={valid:0,expiring:0,expired:0};(r||[]).forEach(x=>stats[x.calculated_status]++);const max=Math.max(1,...Object.values(stats));$('#content').innerHTML=`<div class="cards"><div class="card stat"><small>LAUDOS CADASTRADOS</small><b>${r?.length||0}</b><em>Todos os registros</em></div><div class="card stat"><small>CLIENTES</small><b>${cc||0}</b><em>Base cadastrada</em></div><div class="card stat"><small>PRÓXIMOS DO VENCIMENTO</small><b>${stats.expiring}</b><em>Até 30 dias</em></div><div class="card stat"><small>SERVIÇOS</small><b>${sc||0}</b><em>Serviços registrados</em></div></div><div class="dashboard-grid"><div class="card"><h3>Situação dos laudos</h3><div class="status-bars"><div class="bar" style="height:${stats.valid/max*130+8}px;background:#20a15e"><b>${stats.valid}</b><span>Válidos</span></div><div class="bar" style="height:${stats.expiring/max*130+8}px;background:#e4a11b"><b>${stats.expiring}</b><span>Até 30 dias</span></div><div class="bar" style="height:${stats.expired/max*130+8}px;background:#e30613"><b>${stats.expired}</b><span>Vencidos</span></div></div></div><div class="card"><h3>Próximos vencimentos</h3>${(r||[]).filter(x=>x.calculated_status!=='valid').slice(0,6).map(x=>`<div class="timeline-item"><b>${esc(x.report_number)}</b> · ${esc(x.clients?.name)}<small>${date(x.expiry_date)} · ${statusLabel[x.calculated_status]}</small></div>`).join('')||'<p class="empty">Nenhum alerta.</p>'}</div></div><div class="card" style="margin-top:14px"><h3>Atividades recentes</h3><div class="timeline">${(a||[]).map(x=>`<div class="timeline-item"><b>${esc(x.action)} · ${esc(x.entity)}</b><small>${new Date(x.created_at).toLocaleString('pt-BR')}</small></div>`).join('')||'<p class="empty">Nenhuma atividade.</p>'}</div></div>`}
async function clients(){await loadClients();$('#content').innerHTML=pageHead('Clientes','Cadastros e histórico completo.',`<button class="btn red" onclick="clientForm()">+ Novo cliente</button>`)+`<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>CPF/CNPJ</th><th>Contato</th><th>Cidade</th><th>Cadastro</th><th></th></tr></thead><tbody>${state.clients.map(c=>`<tr><td><b>${esc(c.name)}</b><br><small>${esc(c.email||'')}</small></td><td>${esc(c.document||'—')}</td><td>${esc(c.whatsapp||c.phone||'—')}</td><td>${esc([c.city,c.state].filter(Boolean).join(' / ')||'—')}</td><td>${date(c.created_at.slice(0,10))}</td><td class="actions"><button class="btn small" onclick="clientDetails('${c.id}')">Ver</button> <button class="btn small" onclick="clientForm('${c.id}')">Editar</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">Cadastre o primeiro cliente.</td></tr>`}</tbody></table></div>`}
function clientForm(id=''){const c=state.clients.find(x=>x.id===id)||{};modal(id?'Editar cliente':'Novo cliente',`<form id="entityForm" class="grid"><div class="field span2"><label>Nome / Razão Social *</label><input name="name" required value="${esc(c.name||'')}"></div><div class="field"><label>CPF/CNPJ</label><input name="document" value="${esc(c.document||'')}"></div><div class="field"><label>Responsável</label><input name="contact_name" value="${esc(c.contact_name||'')}"></div><div class="field"><label>Telefone</label><input name="phone" value="${esc(c.phone||'')}"></div><div class="field"><label>WhatsApp</label><input name="whatsapp" value="${esc(c.whatsapp||'')}"></div><div class="field span2"><label>E-mail</label><input type="email" name="email" value="${esc(c.email||'')}"></div><div class="field span2"><label>Endereço</label><input name="address" value="${esc(c.address||'')}"></div><div class="field"><label>Cidade</label><input name="city" value="${esc(c.city||'')}"></div><div class="field"><label>Estado</label><input name="state" maxlength="2" value="${esc(c.state||'SP')}"></div><div class="field span2"><label>Observações</label><textarea name="notes">${esc(c.notes||'')}</textarea></div></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn red" onclick="saveClient('${id}')">Salvar cliente</button>`)}
async function saveClient(id){const f=$('#entityForm');if(!f.reportValidity())return;const d=formObj(f);d.updated_by=state.user.id;if(!id)d.created_by=state.user.id;const q=id?sb.from('clients').update(d).eq('id',id):sb.from('clients').insert(d);const {error}=await q;if(error)return err(error);closeModal();toast('Cliente salvo.');clients()}

async function quoteForm(id='',source=''){let q=(state.currentQuotes||[]).find(x=>x.id===id)||{};let items=[];if(id){const {data}=await sb.from('quote_items').select('*').eq('quote_id',id).order('position');items=data||[]}if(source){q=(state.currentQuotes||[]).find(x=>x.id===source)||{};const {data}=await sb.from('quote_items').select('*').eq('quote_id',source).order('position');items=data||[];q={...q,id:null,quote_number:await nextQuote(),quote_date:iso(),status:'draft'}}if(!id&&!source)q={quote_number:await nextQuote(),quote_date:iso(),status:'draft',payment_terms:'Entrada + 30 + 60 dias',service_description:'Prestação de serviços especializados para adequação e regularização do sistema de prevenção e combate a incêndio, visando atendimento às exigências do Corpo de Bombeiros do Estado de São Paulo para obtenção do AVCB.'};modal(id?'Editar orçamento':source?'Duplicar orçamento':'Novo orçamento',`<form id="quoteForm" class="grid"><div class="field"><label>Nº da proposta *</label><input name="quote_number" required value="${esc(q.quote_number||'')}"></div><div class="field"><label>Cliente *</label><select name="client_id" required><option value="">Selecione</option>${state.clients.map(c=>`<option value="${c.id}" ${c.id===q.client_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input type="date" name="quote_date" value="${q.quote_date||iso()}"></div><div class="field"><label>Válido até</label><input type="date" name="valid_until" value="${q.valid_until||''}"></div><div class="field"><label>Status</label><select name="status">${[['draft','Rascunho'],['sent','Enviado'],['approved','Aprovado'],['rejected','Recusado']].map(x=>`<option value="${x[0]}" ${x[0]===q.status?'selected':''}>${x[1]}</option>`)}</select></div><div class="field"><label>Forma de pagamento</label><input name="payment_terms" value="${esc(q.payment_terms||'')}"></div><div class="field span2"><label>Itens / materiais / serviços</label><div id="quoteItems" class="quote-items"></div><button type="button" class="btn small" onclick="addQuoteRow()">+ Adicionar item</button><div class="quote-total" id="liveTotal">Total: R$ 0,00</div></div><div class="field span2"><label>Descrição geral dos serviços</label><textarea name="service_description">${esc(q.service_description||'')}</textarea></div><div class="field"><label>Desconto</label><input id="discount" name="discount" type="number" step="0.01" min="0" value="${q.discount||0}" oninput="calcQuote()"></div><div class="field span2"><label>Observações</label><textarea name="notes">${esc(q.notes||'')}</textarea></div></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn red" onclick="saveQuote('${id}')">Salvar orçamento</button>`,true);(items.length?items:[{}]).forEach(addQuoteRow);calcQuote()}
function addQuoteRow(i={}){const n=$$('#quoteItems .quote-row').length+1;$('#quoteItems').insertAdjacentHTML('beforeend',`<div class="quote-row"><div class="field"><label>Ref.</label><input class="ref" value="${esc(i.reference||String(n).padStart(3,'0'))}"></div><div class="field"><label>Descrição *</label><input class="desc" required value="${esc(i.description||'')}"></div><div class="field qty"><label>Qtd.</label><input class="qtyv" type="number" min="0.001" step="0.001" value="${i.quantity||1}" oninput="calcQuote()"></div><div class="field price"><label>Valor unit.</label><input class="pricev" type="number" min="0" step="0.01" value="${i.unit_price||0}" oninput="calcQuote()"></div><button type="button" class="remove" onclick="this.parentElement.remove();calcQuote()">×</button></div>`)}

function calcQuote(){const total=quoteItems().reduce((a,i)=>a+i.quantity*i.unit_price,0)-Number($('#discount')?.value||0);$('#liveTotal').textContent='Total: '+brl(total);return Math.max(0,total)}

async function saveDocument(type,id){const f=$('#docForm');if(!f.reportValidity())return;const file=f.file.files[0];const clientId=f.client_id.value;const safe=file.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'-');const path=`${clientId}/${Date.now()}-${safe}`;const {error:u}=await sb.storage.from('technical-documents').upload(path,file);if(u)return err(u);const row={client_id:clientId,name:f.name.value||file.name,storage_path:path,mime_type:file.type,file_size:file.size,uploaded_by:state.user.id};if(id&&type!=='client')row[type+'_id']=id;const {error}=await sb.from('documents').insert(row);if(error)return err(error);closeModal();toast('Documento enviado.');documents()}

async function reportsArea(){const [{data:r},{data:s}]=await Promise.all([sb.from('reports_with_status').select('*,clients(name),report_types(name)').order('expiry_date'),sb.from('services').select('*,clients(name)').order('service_date')]);$('#content').innerHTML=pageHead('Relatórios','Filtre e exporte os dados.',`<button class="btn" onclick="exportCSV()">Exportar CSV</button>`)+`<div class="card"><div class="grid"><div class="field"><label>Tipo</label><select id="reportFilter"><option value="all">Todos os laudos</option><option value="expired">Vencidos</option><option value="expiring">Próximos do vencimento</option><option value="valid">Válidos</option></select></div><div class="field"><label>Cliente</label><select id="clientFilter"><option value="">Todos</option>${state.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`)}</select></div></div><button class="btn red" style="margin-top:12px" onclick="renderReportTable()">Gerar relatório</button></div><div id="reportResult" style="margin-top:14px"></div>`;state.reportData=r||[];state.serviceData=s||[];renderReportTable()}
function renderReportTable(){const st=$('#reportFilter').value,c=$('#clientFilter').value;const rows=state.reportData.filter(x=>(st==='all'||x.calculated_status===st)&&(!c||x.client_id===c));state.filteredReport=rows;$('#reportResult').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Laudo</th><th>Cliente</th><th>Tipo</th><th>Validade</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.report_number)}</td><td>${esc(x.clients?.name)}</td><td>${esc(x.report_types?.name||'—')}</td><td>${date(x.expiry_date)}</td><td>${badge(x.calculated_status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sem resultados.</td></tr>'}</tbody></table></div>`}
function exportCSV(){const rows=state.filteredReport||[];const csv=['Laudo;Cliente;Tipo;Validade;Status',...rows.map(x=>[x.report_number,x.clients?.name,x.report_types?.name,x.expiry_date,statusLabel[x.calculated_status]].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='relatorio-laudos.csv';a.click();URL.revokeObjectURL(a.href)}
async function users(){if(state.profile.role!=='admin')return navigate('dashboard');const {data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});$('#content').innerHTML=pageHead('Usuários','Crie funcionários e controle permissões.',`<button class="btn red" onclick="userForm()">+ Criar usuário</button>`)+`<div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th></th></tr></thead><tbody>${(data||[]).map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${u.role==='admin'?'Administrador':'Funcionário'}</td><td>${badge(u.active?'active':'inactive')}</td><td><button class="btn small" onclick="toggleUser('${u.id}',${!u.active})">${u.active?'Bloquear':'Aprovar'}</button> <button class="btn small" onclick="setRole('${u.id}','${u.role==='admin'?'employee':'admin'}')">Tornar ${u.role==='admin'?'funcionário':'admin'}</button></td></tr>`).join('')}</tbody></table></div>`}
function userForm(){modal('Criar usuário',`<form id="userForm" class="grid"><div class="field span2"><label>Nome *</label><input name="name" required></div><div class="field span2"><label>E-mail *</label><input name="email" type="email" required></div><div class="field span2"><label>Senha temporária *</label><input name="password" type="password" minlength="8" required><small>O funcionário deve trocar pela recuperação de senha.</small></div></form>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn red" onclick="createUser()">Criar pendente</button>`)}
async function createUser(){const f=$('#userForm');if(!f.reportValidity())return;const d=formObj(f);const secondary=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {error}=await secondary.auth.signUp({email:d.email,password:d.password,options:{data:{name:d.name},emailRedirectTo:location.href}});if(error)return err(error);closeModal();toast('Usuário criado como pendente. Agora clique em Aprovar.');setTimeout(users,1200)}
async function toggleUser(id,active){if(id===state.user.id&&!active)return toast('Você não pode bloquear o próprio acesso.',true);const {error}=await sb.from('profiles').update({active}).eq('id',id);if(error)return err(error);toast(active?'Usuário aprovado.':'Usuário bloqueado.');users()}
async function setRole(id,role){if(id===state.user.id&&role!=='admin')return toast('Mantenha ao menos seu acesso administrativo.',true);const {error}=await sb.from('profiles').update({role}).eq('id',id);if(error)return err(error);toast('Permissão atualizada.');users()}
async function settings(){if(state.profile.role!=='admin')return navigate('dashboard');const s=state.settings||{};$('#content').innerHTML=pageHead('Configurações','Dados utilizados nos documentos e orçamentos.')+`<div class="card"><form id="settingsForm" class="grid"><div class="field"><label>Nome da empresa</label><input name="name" value="${esc(s.name||'')}"></div><div class="field"><label>Razão social</label><input name="legal_name" value="${esc(s.legal_name||'')}"></div><div class="field"><label>CNPJ</label><input name="cnpj" value="${esc(s.cnpj||'')}"></div><div class="field"><label>Telefone</label><input name="phone" value="${esc(s.phone||'')}"></div><div class="field"><label>WhatsApp</label><input name="whatsapp" value="${esc(s.whatsapp||'')}"></div><div class="field"><label>E-mail</label><input name="email" value="${esc(s.email||'')}"></div><div class="field"><label>Site</label><input name="website" value="${esc(s.website||'')}"></div><div class="field"><label>Endereço</label><input name="address" value="${esc(s.address||'')}"></div><div class="field"><label>Responsável técnico</label><input name="technical_manager" value="${esc(s.technical_manager||'')}"></div><div class="field"><label>Registro técnico</label><input name="technical_registration" value="${esc(s.technical_registration||'')}"></div><div class="span2"><button class="btn red" type="button" onclick="saveSettings()">Salvar configurações</button></div></form></div>`}
async function saveSettings(){const d=formObj($('#settingsForm'));d.updated_by=state.user.id;const {error}=await sb.from('company_settings').update(d).eq('id',state.settings.id);if(error)return err(error);await loadSettings();toast('Configurações salvas.')}
function tutorial(){modal('Tutorial rápido — como usar',`<p>O sistema salva tudo automaticamente na nuvem depois que você pressiona <b>Salvar</b>. Pode usar no computador ou no celular.</p>${[['1','Cadastre o cliente','Abra Clientes, clique em Novo cliente e preencha os dados. Faça isso apenas uma vez.'],['2','Crie um orçamento','Abra Orçamentos, escolha o cliente, adicione cada material ou serviço, quantidade e preço. O total é calculado sozinho.'],['3','Salve e gere o PDF','Clique em Salvar orçamento. Depois use o botão PDF para baixar e enviar pelo WhatsApp ou e-mail.'],['4','Reaproveite um orçamento','Clique em Duplicar. O sistema copia itens e valores, cria um novo número e você altera somente o necessário.'],['5','Cadastre um laudo','Abra Laudos, informe cliente e validade. Verde significa válido; amarelo vence em até 30 dias; vermelho está vencido.'],['6','Guarde documentos','Use Anexar em um laudo/serviço ou abra Documentos. PDFs e fotos ficam disponíveis de qualquer lugar.'],['7','Crie funcionários','Em Usuários, crie a conta e depois clique em Aprovar. Administrador configura tudo; funcionário não exclui registros nem gerencia acessos.']].map(x=>`<div class="tutorial-step"><b>${x[0]}</b><div><h4>${x[1]}</h4><p>${x[2]}</p></div></div>`).join('')}`,`<button class="btn red" onclick="closeModal()">Entendi</button>`,true)}
async function globalSearch(q){q=q.trim();if(q.length<2)return;const [{data:c},{data:r},{data:o}]=await Promise.all([sb.from('clients').select('id,name,document').ilike('name',`%${q}%`).limit(6),sb.from('reports').select('id,report_number').ilike('report_number',`%${q}%`).limit(6),sb.from('quotes').select('id,quote_number').ilike('quote_number',`%${q}%`).limit(6)]);modal('Resultados da pesquisa',`<h3>Clientes</h3>${(c||[]).map(x=>`<p><button class="link" onclick="closeModal();navigate('clients')">${esc(x.name)}</button> · ${esc(x.document||'')}</p>`).join('')||'<p>Nenhum.</p>'}<h3>Laudos</h3>${(r||[]).map(x=>`<p>${esc(x.report_number)}</p>`).join('')||'<p>Nenhum.</p>'}<h3>Orçamentos</h3>${(o||[]).map(x=>`<p>${esc(x.quote_number)}</p>`).join('')||'<p>Nenhum.</p>'}`,`<button class="btn" onclick="closeModal()">Fechar</button>`)}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginMessage').textContent='Entrando...';const {error}=await sb.auth.signInWithPassword({email:$('#loginEmail').value,password:$('#loginPassword').value});$('#loginMessage').textContent=error?'E-mail ou senha incorretos.':''});
$('#forgotBtn').onclick=async()=>{const email=$('#loginEmail').value;if(!email)return $('#loginMessage').textContent='Digite seu e-mail primeiro.';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});$('#loginMessage').textContent=error?error.message:'Enviamos o link de recuperação para o e-mail.'};
$('#logoutBtn').onclick=()=>sb.auth.signOut();$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');$('#tutorialBtn').onclick=$('#helpBtn').onclick=tutorial;$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)};let searchTimer;$('#globalSearch').oninput=e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>globalSearch(e.target.value),500)};
init().catch(err);
</script>
</body></html>
